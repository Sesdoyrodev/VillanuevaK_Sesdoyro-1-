<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning Task 6.2 - Animated SVG Icon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    svg {
      width: 300px;
      height: 300px;
      display: block;
    }
  </style>
</head>
<body>

  <svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#ec4899" />
      </linearGradient>
    </defs>

    <!-- Soft pulsing glow ring -->
    <circle cx="150" cy="150" r="88" fill="none" stroke="#fde68a" stroke-width="4">
      <animate attributeName="r" values="82;94;82" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.35;0.9" dur="2.4s" repeatCount="indefinite" />
    </circle>

    <!-- Rotating dashed orbit ring -->
    <circle cx="150" cy="150" r="108" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="10 10">
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0 150 150"
                        to="360 150 150"
                        dur="8s"
                        repeatCount="indefinite" />
    </circle>

    <!-- Main animated 4-point star icon -->
    <g transform="translate(150, 150)">
      <g>
        <path d="M 0 -62
                 C 10 -18, 18 -10, 62 0
                 C 18 10, 10 18, 0 62
                 C -10 18, -18 10, -62 0
                 C -18 -10, -10 -18, 0 -62 Z"
              fill="url(#iconGrad)" />
        <animateTransform attributeName="transform"
                          type="scale"
                          values="0.92;1.08;0.92"
                          dur="2s"
                          repeatCount="indefinite" />
      </g>
    </g>

    <!-- Small twinkling accent dots -->
    <circle cx="72" cy="78" r="5" fill="#f59e0b">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="232" cy="84" r="4" fill="#ec4899">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="226" cy="222" r="5" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite" />
    </circle>
  </svg>

</body>
</html>
